# Dapr configuration
# Set to true to auto-start Dapr via Testcontainers (self-contained but dashboard won't see it)
# Set to false to use your existing standalone Dapr (visible in diagrid-dashboard)
quarkus.dapr.devservices.enabled=false
quarkus.dapr.workflow.enabled=false

# Dapr sidecar endpoints (override via env vars or system properties)
# For local: DAPR_GRPC_ENDPOINT=http://localhost:40001 DAPR_HTTP_ENDPOINT=http://localhost:3500
dapr.grpc.endpoint=${DAPR_GRPC_ENDPOINT:http://localhost:40001}
dapr.http.endpoint=${DAPR_HTTP_ENDPOINT:http://localhost:3500}

# Ollama configuration (local LLM — no API key needed)
# Make sure Ollama is running: ollama serve
# Pull a model first: ollama pull llama3.2
quarkus.langchain4j.ollama.chat-model.model-id=llama3.2
quarkus.langchain4j.ollama.timeout=120s
quarkus.dapr.devservices.dashboard.url=localhost:8081

# Agent Registry
dapr.agents.statestore=agent-registry
dapr.agents.team=travel-planner
dapr.appid=langchain4j-agent

# Logging
quarkus.log.category."io.dapr.examples.travel".level=DEBUG
quarkus.log.category."io.dapr.quarkus.agents.registry".level=DEBUG
quarkus.log.category."io.quarkiverse.dapr.workflows".level=DEBUG

# OpenTelemetry
quarkus.otel.propagators=tracecontext,baggage

# LangChain4j Tracing
quarkus.langchain4j.tracing.include-prompt=true
quarkus.langchain4j.tracing.include-completion=true
quarkus.langchain4j.tracing.include-tool-arguments=true
quarkus.langchain4j.tracing.include-tool-result=true
